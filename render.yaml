services:
  # Đổi tên + thêm region so với service cũ ("hdhtoys-backend") vì Render
  # KHÔNG cho đổi vùng của service đã tạo — dùng tên mới để Render tạo service
  # THẬT MỚI ở Singapore (cùng vùng với Neon, ap-southeast-1) thay vì cố sửa
  # tại chỗ. Service cũ vẫn chạy bình thường tới khi bạn tự xóa sau khi đã
  # chuyển VITE_API_URL trên Vercel sang service mới và xác nhận ổn.
  - type: web
    name: hdhtoys-backend-sg
    region: singapore
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # Danh sách origin frontend được phép gọi API (CORS) — bắt buộc set đúng
      # domain frontend thật trên production, KHÔNG để trống.
      - key: CORS_ORIGINS
        sync: false
      # Để trống SEED_ADMIN_PASSWORD thì hệ thống tự sinh mật khẩu ngẫu nhiên
      # và in ra log deploy đúng một lần — xem log ngay sau lần deploy đầu.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Thông tin liên hệ in trên hóa đơn PDF — để trống thì hóa đơn không in
      # dòng đó (không bịa hotline/địa chỉ giả).
      - key: STORE_HOTLINE
        sync: false
      - key: STORE_ADDRESS
        sync: false
      - key: STORE_WEBSITE
        sync: false
      - key: STORE_FACEBOOK_URL
        sync: false
      - key: STORE_ZALO_URL
        sync: false
      # Tích hợp thanh toán QR ngân hàng (SRS mục 3.16) — để trống 3 mục
      # sync:false thì tính năng tự vô hiệu (đơn hàng vẫn tạo/đổi trạng thái
      # thủ công như thường, chỉ không có QR/không tự hoàn thành qua webhook).
      - key: VIETQR_BANK_BIN
        sync: false
      - key: VIETQR_ACCOUNT_NO
        sync: false
      - key: VIETQR_ACCOUNT_NAME
        value: "HDH TOYS"
      - key: VIETQR_TTL_MINUTES
        value: "15"
      - key: VIETQR_WEBHOOK_SECRET
        sync: false
